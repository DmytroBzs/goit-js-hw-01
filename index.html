<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кнопки з лічильником</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #007bff; /* Синій фон */
        font-family: Arial, sans-serif;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;

        padding: 40px;
        border-radius: 10px;
      }

      .counter-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      .counter {
        font-size: 28px;
        font-weight: bold;
        color: #333;
        margin-left: 20px;
      }

      .button {
        padding: 12px 24px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background-color: #28a745;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        flex-grow: 1;
        text-align: center;
      }

      .button:hover {
        background-color: #218838;
      }

      .reset-button {
        padding: 10px 20px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        background-color: #dc3545;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      }

      .reset-button:hover {
        background-color: #c82333;
      }

      .button,
      .counter {
        max-width: 400px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="counter-container">
        <button id="button1" class="button">Follows</button>
        <span id="counter1" class="counter">0</span>
      </div>

      <div class="counter-container">
        <button id="button2" class="button">Likes</button>
        <span id="counter2" class="counter">0</span>
      </div>

      <div class="counter-container">
        <button id="button3" class="button">Comments</button>
        <span id="counter3" class="counter">0</span>
      </div>

      <button id="resetButton" class="reset-button">Скинути</button>
    </div>

    <script>
      // Отримуємо лічильники зі сховища, або задаємо початкове значення
      let count1 = localStorage.getItem("count1")
        ? parseInt(localStorage.getItem("count1"))
        : 0;
      let count2 = localStorage.getItem("count2")
        ? parseInt(localStorage.getItem("count2"))
        : 0;
      let count3 = localStorage.getItem("count3")
        ? parseInt(localStorage.getItem("count3"))
        : 0;

      // Отримуємо елементи
      const button1 = document.getElementById("button1");
      const button2 = document.getElementById("button2");
      const button3 = document.getElementById("button3");
      const counter1 = document.getElementById("counter1");
      const counter2 = document.getElementById("counter2");
      const counter3 = document.getElementById("counter3");
      const resetButton = document.getElementById("resetButton");

      // Відображаємо початкові значення лічильників
      counter1.textContent = count1;
      counter2.textContent = count2;
      counter3.textContent = count3;

      // Обробник для кнопки 1
      button1.addEventListener("click", () => {
        count1++;
        counter1.textContent = count1;
        localStorage.setItem("count1", count1); // Зберігаємо в localStorage
      });

      // Обробник для кнопки 2
      button2.addEventListener("click", () => {
        count2++;
        counter2.textContent = count2;
        localStorage.setItem("count2", count2); // Зберігаємо в localStorage
      });

      // Обробник для кнопки 3
      button3.addEventListener("click", () => {
        count3++;
        counter3.textContent = count3;
        localStorage.setItem("count3", count3); // Зберігаємо в localStorage
      });

      // Обробник для кнопки скидання
      resetButton.addEventListener("click", () => {
        count1 = 0;
        count2 = 0;
        count3 = 0;
        counter1.textContent = count1;
        counter2.textContent = count2;
        counter3.textContent = count3;
        localStorage.setItem("count1", count1);
        localStorage.setItem("count2", count2);
        localStorage.setItem("count3", count3);
      });
    </script>
  </body>
</html>
